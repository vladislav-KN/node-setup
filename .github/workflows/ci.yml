name: Installer checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check shell and Python syntax
        run: |
          bash -n install.sh
          python -m py_compile installer.py
      - name: Install test dependencies and verified Caddy binary
        run: |
          python -m pip install -r requirements-test.txt
          mkdir -p "$RUNNER_TEMP/caddy-bin"
          curl -fsSL https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_linux_amd64.tar.gz -o "$RUNNER_TEMP/caddy_2.11.9_linux_amd64.tar.gz"
          curl -fsSL https://github.com/caddyserver/caddy/releases/download/v2.11.9/caddy_2.11.9_checksums.txt -o "$RUNNER_TEMP/caddy_checksums.txt"
          grep ' caddy_2.11.9_linux_amd64.tar.gz$' "$RUNNER_TEMP/caddy_checksums.txt" | (cd "$RUNNER_TEMP" && sha512sum -c -)
          tar -xzf "$RUNNER_TEMP/caddy_2.11.9_linux_amd64.tar.gz" -C "$RUNNER_TEMP/caddy-bin" caddy
          echo "$RUNNER_TEMP/caddy-bin" >> "$GITHUB_PATH"
      - name: Unit tests and Unix-socket protocol integration
        run: python -m unittest discover -s tests -v
      - name: Validate generated HTTP-01 configuration
        env:
          EMAIL: admin@example.com
          DOMAIN: node.example.com
          SECRET_KEY: preview-only
          SERVICE_NAME: filebrowser
        run: |
          python installer.py --render-only --output rendered
          docker compose -f rendered/compose.json config --quiet
          caddy validate --config rendered/caddy/config/caddy.json
      - name: Build Cloudflare variant and validate its DNS configuration
        env:
          EMAIL: admin@example.com
          DOMAIN: node.example.com
          SECRET_KEY: preview-only
          SERVICE_NAME: filebrowser
          TLS_MODE: cloudflare
          CF_Token: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC
        run: |
          python installer.py --render-only --output rendered-cloudflare
          docker compose -f rendered-cloudflare/compose.json config --quiet
          docker compose -f rendered-cloudflare/compose.json build caddy
          docker compose -f rendered-cloudflare/compose.json run --rm --no-deps -T --entrypoint caddy caddy validate --config /etc/caddy/caddy.json
